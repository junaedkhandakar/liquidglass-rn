name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # required: lets the job mint the OIDC token npm verifies
  contents: read

jobs:
  publish:
    name: Publish liquidglass-rn via OIDC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm CLI supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Publish to npm
        run: |
          npm publish --provenance --access public
          echo "### 🚀 Successfully Published via Trusted Publishing (OIDC)!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Package is live at: [https://www.npmjs.com/package/liquidglass-rn](https://www.npmjs.com/package/liquidglass-rn)" >> $GITHUB_STEP_SUMMARY
